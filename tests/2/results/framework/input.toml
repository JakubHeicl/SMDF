[simulation]
units = "reduced"
dt = 0.002
steps = 100
seed = 42

[initial]
source = "lattice"
temperature = 1.0
n_side = 5
density = 0.5
label = "Ar"

[system]
mass = 1.0

[interaction]
type = "lennard_jones"
epsilon = 1.0
sigma = 1.0
cutoff = 2.5
shift_energy = true

[integrator]
type = "velocity_verlet"

[thermostat]
type = "none"

[output]
directory = "results/framework"
thermo_stride = 1
trajectory_stride = 1
