[simulation]
units = "reduced"
dt = 0.005
steps = 10000
seed = 42

[initial]
source = "lattice"
temperature = 2.0
n_side = 5
density = 0.5
label = "Ar"

[system]
mass = 1.0

[interaction]
type = "lennard_jones"
epsilon = 1.0
sigma = 1.0
cutoff = 2.5
shift_energy = true

[integrator]
type = "baoab"

[thermostat]
type = "langevin"
temperature = 1.0
tau = 1.0

[output]
directory = "results/framework_langevin"
thermo_stride = 10
trajectory_stride = 100
