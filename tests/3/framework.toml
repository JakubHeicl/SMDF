[simulation]
units = "reduced"
dt = 0.005
steps = 0
seed = 42

[initial]
source = "xyz"
path = "pair_pbc.xyz"
temperature = 0.0

[system]
mass = 1.0
box = [10.0, 10.0, 10.0]

[interaction]
type = "lennard_jones"
epsilon = 1.0
sigma = 1.0
cutoff = 2.5
shift_energy = true

[integrator]
type = "velocity_verlet"

[thermostat]
type = "none"

[output]
directory = "results/framework"
thermo_stride = 1
trajectory_stride = 1
